{% extends "generator/base.html" %}

{% block content %}
<div class="form-container">
    <h2>Add New App</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        
        {% for field in form %}
            <div class="field">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label><br>
                {{ field }}
                {% if field.errors %}
                    <div style="color:red;">
                        {{ field.errors }}
                    </div>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit">Create App</button>
    </form>
</div>


{% endblock %}
