<!-- base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}The Generator{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        html {
            scroll-behavior: smooth; /* Smooth scrolling for anchor links */
        }
    </style>
</head>
<body>

    <!-- Main Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'generator:home' %}">The Generator</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"
                    aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="#home">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#quick_guide">Quick Guide</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contact">Contacts</a></li>
                </ul>
            </div>
        </div>
    </nav>
<!-- Technical Features Navigation -->
<nav class="navbar navbar-expand-lg" style="background: linear-gradient(90deg, #6a11cb, #2575fc);">
    <div class="container-fluid">
        <div class="collapse navbar-collapse" id="navbarTech">
            <ul class="navbar-nav me-auto" style="gap: 20px;">
                <li class="nav-item">
                    <a class="nav-link text-white d-flex align-items-center" href="{% url 'generator:add_model_field' %}">
                        <i class="bi bi-plus-square-fill me-2"></i> Add Field
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white d-flex align-items-center" href="{% url 'generator:add_model' %}">
                        <i class="bi bi-diagram-3-fill me-2"></i> Add Models
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white d-flex align-items-center" href="{% url 'generator:create_crud_app' %}">
                        <i class="bi bi-gear-fill me-2"></i> Add App
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- Page Content -->
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
