<!-- base.html -->
 {% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}The Generator{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- Custom Main CSS -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>

    <!-- Main Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark main-navbar sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'generator:home' %}">The Generator</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"
                    aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav me-auto">
                    <li><a href="#home" class="nav-link" data-target="home">Home</a></li>
                    <li><a href="#about" class="nav-link" data-target="about">About</a></li>
                    <li><a href="#quick_guide" class="nav-link" data-target="quick_guide">Quick Guide</a></li>
                    <li><a href="#contact" class="nav-link" data-target="contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Technical Features Navigation -->
    <nav class="navbar navbar-expand-lg tech-navbar">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTech"
                    aria-controls="navbarTech" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarTech">
                <ul class="navbar-nav me-auto tech-nav-links">
                    <li class="nav-item">
                        <a  href="{% url 'generator:add_field' %}">
                            <i class="bi bi-plus-square-fill me-2"></i> Add Field
                        </a>
                    </li>
                    <li class="nav-item">
                        <a  href="{% url 'generator:add_model' %}">
                            <i class="bi bi-diagram-3-fill me-2"></i> Add Model
                        </a>
                    </li>
                    <li class="nav-item">
                        <a  href="{% url 'generator:add_app' %}">
                            <i class="bi bi-gear-fill me-2"></i> Add App
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
