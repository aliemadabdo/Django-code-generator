{% extends "generator/base.html" %}
{% load static %}

{% block title %}{{ element }} Added{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="alert alert-success" role="alert">
      <h4 class="alert-heading">{{ element }} created</h4>
      <p>The {{ element }} <strong>{{ element_name }}</strong> was created successfully.</p>
    </div>
  <div class="mt-3">
    <a href="{% url 'generator:home' %}" class="btn btn-secondary">Back to Home</a>
    <a href="{% url 'generator:add_field' %}" class="btn btn-primary">Add another field first</a>
  </div>
</div>
{% endblock %}
