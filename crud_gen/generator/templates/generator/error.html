{% extends "generator/base.html" %}
{% load static %}

{% block title %} Failed to add the {{ element }} {% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="alert alert-danger" role="alert">
      <h4 class="alert-heading">Something went wrong</h4>
      <p>We couldn't create the {{ element }}. Please try again.</p>
    </div>

  <div class="mt-3">
    <a href="{% url 'generator:add_{{ element }}' %}" class="btn btn-primary">Add another {{ element }}</a>
    <a href="{% url 'generator:Home' %}" class="btn btn-secondary">Back to Home</a>
  </div>
</div>
{% endblock %}
