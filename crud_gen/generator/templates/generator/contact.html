<!DOCTYPE html>

    <title>Contact</title>

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .contact-list {
            list-style: none;
            padding: 0;
        }
        .contact-list li {
            margin: 15px 0;
            font-size: 18px;
        }
        a {
            color: #0073e6;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contact</h1>

            <li>GitHub: <a href="https://github.com/aliemadabdo" target="_blank">github.com/aliemadabdo</a></li>
